name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      # Verify the published ESM/types resolve cleanly for consumers.
      - run: npx --yes @arethetypeswrong/cli --pack --ignore-rules cjs-resolves-to-esm
